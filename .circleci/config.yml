            touch /tmp/rerun-wrapper-dependency-audit/rebuild-partner-portal && echo 'launch-service-before-tests lint-kernel' > /tmp/rerun-wrapper-dependency-audit/rebuild-partner-portal
            wc -c < /tmp/rerun-wrapper-dependency-audit/rebuild-partner-portal
            echo 'retry 3 of 3'; entries=(mouse horse toad); pkg="${entries[*]}"; echo "${#pkg}"

